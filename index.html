<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROPINA VIVO v2 - Link Público</title>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const cfg={apiKey:"AIzaSyDXyhSScQ4xrwW6YouUHuj7NCLxdqoa8Rc",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.firebasestorage.app",messagingSenderId:"509983775898",appId:"1:509983775898:web:47695f5b312553d9bd1323"};
const app=initializeApp(cfg); const db=getFirestore(app);
let pc, localStream, roomId, isArtist=false;
const servers={iceServers:[{urls:['stun:stun1.l.google.com:19302','stun:stun2.l.google.com:19302']}]};

async function init(){
  const urlParams=new URLSearchParams(window.location.search);
  roomId=urlParams.get('id');
  if(roomId){ // MODO ESPECTADOR
    document.getElementById('setup').style.display='none';
    document.getElementById('viewer').style.display='block';
    let snap=await getDoc(doc(db,"propina_vivo",roomId));
    if(!snap.exists()){document.getElementById('vStatus').innerText='❌ Vivo no encontrado';return;}
    let data=snap.data();
    document.getElementById('vNombre').innerText=data.nombre;
    document.getElementById('vAlias').innerText=data.alias;
    document.getElementById('vBtnMp').href=data.mpLink;
    document.getElementById('vBtnMp').innerText='💸 Dejar propina a '+data.nombre;
    // Conectar WebRTC como viewer
    pc=new RTCPeerConnection(servers);
    pc.ontrack=e=>{document.getElementById('vVideo').srcObject=e.streams[0];};
    pc.onicecandidate=e=>{ if(e.candidate) return; };
    onSnapshot(doc(db,"propina_vivo",roomId), async s=>{
      let d=s.data();
      if(d.offer &&!pc.currentRemoteDescription){
        await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
        let answer=await pc.createAnswer();
        await pc.setLocalDescription(answer);
        await updateDoc(doc(db,"propina_vivo",roomId),{answer:{type:answer.type,sdp:answer.sdp}});
      }
    });
    onSnapshot(collection(db,"propina_vivo",roomId,"viewerCandidates"), s=>{
      s.docChanges().forEach(async c=>{
        if(c.type==='added'){ try{await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()));}catch(e){} }
      });
    });
  } else {
    document.getElementById('setup').style.display='block';
  }
}
window.prender=async()=>{
  let nombre=document.getElementById('nombre').value.trim()||'Artista La Plata';
  let alias=document.getElementById('alias').value.trim();
  if(!alias){alert('Poné alias de MP');return;}
  let mpLink=alias.startsWith('http')?alias:'https://link.mercadopago.com.ar/'+alias.replace('.mp','').replace(/\./g,'') // fallback simple
  if(alias.includes('.')) mpLink='https://www.mercadopago.com.ar/paid?alias='+encodeURIComponent(alias);
  isArtist=true;
  document.getElementById('btnPrender').innerText='⏳ Creando sala...';
  roomId=Math.random().toString(36).substring(2,8).toUpperCase();
  let roomRef=doc(db,"propina_vivo",roomId);
  pc=new RTCPeerConnection(servers);
  localStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:true});
  document.getElementById('aVideo').srcObject=localStream;
  localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));
  let offer=await pc.createOffer();
  await pc.setLocalDescription(offer);
  await setDoc(roomRef,{nombre,alias,mpLink,offer:{type:offer.type,sdp:offer.sdp},created:new Date().toISOString(),vivo:true});
  pc.onicecandidate=e=>{ if(e.candidate) setDoc(doc(collection(roomRef,"artistCandidates")),e.candidate.toJSON()); };
  onSnapshot(doc(db,"propina_vivo",roomId), async s=>{
    let d=s.data(); if(d && d.answer &&!pc.currentRemoteDescription){
      await pc.setRemoteDescription(new RTCSessionDescription(d.answer));
    }
  });
  onSnapshot(collection(roomRef,"viewerCandidates"), s=>{});
  onSnapshot(collection(roomRef,"artistCandidates"), s=>{});
  // Mostrar link público
  let publicUrl=window.location.href.split('?')[0]+'?id='+roomId;
  document.getElementById('setup').style.display='none';
  document.getElementById('artist').style.display='block';
  document.getElementById('aNombre').innerText=nombre;
  document.getElementById('aLink').innerText=publicUrl;
  document.getElementById('aLink').href=publicUrl;
  document.getElementById('aQr').src='https://api.qrserver.com/v1/create-qr-code/?size=500x500&data='+encodeURIComponent(publicUrl);
  document.getElementById('aMp').href=mpLink;
  document.getElementById('aMp').innerText='Alias: '+alias;
}
window.onload=init;
</script>
<style>
body{background:#0f172a;color:#fff;font-family:system-ui;padding:12px}
.box{max-width:520px;margin:auto;background:#1e293b;padding:16px;border-radius:20px}
input{width:100%;padding:12px;border-radius:10px;border:none;margin-top:6px;font-weight:700;box-sizing:border-box}
button{width:100%;padding:14px;border:none;border-radius:12px;font-weight:900;margin-top:10px}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:9/16;object-fit:cover}
.qr{background:#fff;padding:12px;border-radius:16px;color:#000;text-align:center;margin-top:12px}
a.btn{display:block;text-align:center;padding:14px;border-radius:12px;text-decoration:none;font-weight:900;margin-top:8px}
</style>
</head>
<body>
<div class="box">
<div id="setup" style="display:none">
<h2 style="color:#00f5d4;margin:0">🎻 v2 - Prender vivo con link</h2>
<p style="font-size:0.8rem">Este celu es el que toca. Genera link y QR para el otro.</p>
<input id="nombre" placeholder="Ej: Joaco - Guitarra 7 y 50">
<input id="alias" placeholder="Tu alias MP: Ej: joaco.guitarra.mp">
<button id="btnPrender" onclick="prender()" style="background:#00f5d4;color:#000">🔴 PRENDER VIVO Y GENERAR LINK</button>
</div>

<div id="artist" style="display:none">
<video id="aVideo" autoplay muted playsinline></video>
<div class="qr">
<div id="aNombre" style="font-weight:900;font-size:1.2rem"></div>
<img id="aQr" style="width:100%;max-width:300px">
<div style="margin-top:8px;font-size:0.9rem;word-break:break-all">
<a id="aLink" target="_blank" style="font-weight:800"></a><br><br>
<a id="aMp" target="_blank" class="btn" style="background:#009ee3;color:#fff"></a>
</div>
<p style="font-size:0.7rem;margin-top:8px">IMPRIMÍ este QR o mostralo en otro celu en el semáforo. El que escanea entra al vivo.</p>
</div>
<button onclick="location.reload()" style="background:#334155;color:#fff">Apagar</button>
</div>

<div id="viewer" style="display:none">
<h2 id="vNombre" style="color:#00f5d4;margin:0;text-align:center"></h2>
<video id="vVideo" autoplay playsinline controls style="margin-top:10px"></video>
<div id="vStatus" style="text-align:center;font-size:0.8rem;margin-top:6px">Conectando al vivo...</div>
<div class="qr">
<div id="vAlias" style="font-weight:800;background:#fef3c7;padding:6px;border-radius:8px"></div>
<a id="vBtnMp" target="_blank" class="btn" style="background:#00f5d4;color:#000">💸 Dejar propina</a>
<p style="font-size:0.7rem">Gracias por apoyar al arte callejero platense. Si no podés ahora, queda el alias.</p>
</div>
</div>
</div>
</body>
</html>
