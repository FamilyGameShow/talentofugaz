<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talento Fugaz</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>
body{background:#000;color:#fff;text-align:center;font-family:system-ui;padding:12px;margin:0}
video{width:100%;max-width:400px;background:#111;border-radius:16px;border:2px solid #00f5d4;min-height:260px;object-fit:cover}
button{background:#00f5d4;color:#000;border:0;padding:14px 24px;border-radius:30px;font-weight:900;margin:6px;font-size:16px;cursor:pointer}
button.sec{background:#222;color:#fff;border:1px solid #333}
.box{background:#151515;padding:14px;border-radius:14px;max-width:420px;margin:14px auto;border:1px solid #222}
#playOverlay{display:none;background:#00f5d4;color:#000;padding:16px;border-radius:12px;font-weight:900;margin:10px auto;max-width:420px;cursor:pointer}
input,select{padding:12px;border-radius:20px;border:1px solid #333;background:#111;color:#fff;text-align:center}
.money{background:#0e2a26;border:1px solid #00f5d422;padding:12px;border-radius:12px;text-align:left}
</style>
</head>
<body>
<h1 id="tit" style="color:#00f5d4;letter-spacing:2px">FUGAZ</h1>
<div id="status" style="color:#00f5d4;font-size:12px">Listo</div>
<div id="setup"><input id="alias" placeholder="Tu alias MP ej: mati.mp"><br><br><button onclick="prender()">🔴 PRENDER VIVO</button><p style="color:#666;font-size:11px;max-width:340px;margin:12px auto">Al prender aceptás comisión 15% - Tu ganancia 85% - Plata va directo a vos - Sin tongo</p></div>
<div id="vivoUI" style="display:none"><video id="localVideo" autoplay muted playsinline></video><div class="box"><input id="shareLink" readonly style="width:90%"><br><button onclick="copiarLink()">Copiar Link</button><div id="qr" style="margin-top:10px"></div><p id="viewers">👀 0 mirando</p><div class="money"><div>💰 Total: <b id="total">$0</b></div><div>🎤 Tuyo 85%: <b id="tuyo">$0</b></div><div style="font-size:12px;color:#888">Comisión Talento Fugaz 15%: <span id="comision">$0</span></div><div id="lista" style="margin-top:8px;font-size:12px;color:#aaa"></div></div></div><button onclick="location.reload()" style="background:#333;color:#fff">Apagar Vivo</button></div>
<div id="viewerUI" style="display:none"><video id="remoteVideo" autoplay playsinline muted></video><div id="playOverlay" onclick="desbloquear()">👆 TOCÁ PARA VER Y ESCUCHAR</div><p id="viewerStatus">Conectando...</p><div class="box"><h3 style="margin:4px;color:#00f5d4">Talento Fugaz</h3><p id="aliasShow" style="color:#fff;font-size:22px;font-weight:900;margin:6px"></p><button onclick="copiarYTransferir()" style="background:#fff;color:#000;width:100%;font-size:17px">📋 Copiar alias y transferir</button><p style="font-size:11px;color:#666;margin-top:8px">Se copia el alias y te abre Mercado Pago</p><div style="margin-top:14px;border-top:1px solid #222;padding-top:10px"><select id="monto"><option value="500">$500</option><option value="1000" selected>$1000</option><option value="2000">$2000</option><option value="5000">$5000</option><option value="10000">$10000</option></select><button onclick="yaTransferi()">✅ Ya transferí</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBu3sYrZ4s0oKba3R7a_hEFwkc2y0Vnyd4",authDomain:"family-game-show.firebaseapp.com",projectId:"family-game-show",storageBucket:"family-game-show.appspot.com",messagingSenderId:"1093862512261",appId:"1:1093862512261:web:6c7d5a3a7c0a6c9d8e1f2a3"};
firebase.initializeApp(firebaseConfig);const db=firebase.firestore();
let localStream,pcs={},currentAlias="",currentRoomId=null;
const ice={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const roomIdParam=new URLSearchParams(location.search).get('id');
if(roomIdParam){document.getElementById('tit').innerText='Talento Fugaz';currentRoomId=roomIdParam;entrarComoEspectador(roomIdParam);}
function copiarLink(){const ta=document.createElement('textarea');ta.value=document.getElementById('shareLink').value;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);alert('Link copiado');}
function copiarYTransferir(){
 const ta=document.createElement('textarea');ta.value=currentAlias;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(e){}document.body.removeChild(ta);
 alert('Alias '+currentAlias+' copiado ✅\n\nTe abro Mercado Pago. Andá a Transferir y pegalo.');
 window.location.href='mercadopago://';
 setTimeout(()=>{window.open('https://www.mercadopago.com.ar','_blank');},1200);
}
async function prender(){const a=document.getElementById('alias').value.trim();if(!a) return alert('Poné alias');currentAlias=a;try{localStream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});}catch(e){alert('Necesitás dar permiso de cámara');return;}document.getElementById('localVideo').srcObject=localStream;document.getElementById('setup').style.display='none';document.getElementById('vivoUI').style.display='block';document.getElementById('tit').innerText='FUGAZ - Panel Artista';crearSala(a);}
async function crearSala(alias){
 const roomRef=await db.collection('fugaz_vivo').add({alias,created:Date.now()});currentRoomId=roomRef.id;const link=location.origin+location.pathname+'?id='+roomRef.id;document.getElementById('shareLink').value=link;document.getElementById('qr').innerHTML=`<img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(link)}" style="border-radius:12px">`;document.getElementById('status').innerText='🔴 VIVO PRENDIDO';
 roomRef.collection('viewers').onSnapshot(async snap=>{document.getElementById('viewers').innerText='👀 '+snap.size+' mirando';for(let ch of snap.docChanges()){if(ch.type==='added'){const doc=ch.doc;if(pcs[doc.id])continue;const d=doc.data();if(!d.offer)continue;const pc=new RTCPeerConnection(ice);pcs[doc.id]=pc;localStream.getTracks().forEach(t=>pc.addTrack(t,localStream));pc.onicecandidate=e=>{if(e.candidate) doc.ref.collection('callerCandidates').add(e.candidate.toJSON())};await pc.setRemoteDescription(new RTCSessionDescription(d.offer));const ans=await pc.createAnswer();await pc.setLocalDescription(ans);await doc.ref.update({answer:{type:ans.type,sdp:ans.sdp}});doc.ref.collection('calleeCandidates').onSnapshot(s=>{s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()))}catch{}})});}}});
 roomRef.collection('propinas').orderBy('ts','desc').onSnapshot(snap=>{let total=0,html='';snap.forEach(d=>{total+=Number(d.data().monto||0);const h=new Date(d.data().ts).toLocaleTimeString();html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:3px 0"><span>${h}</span><span>$${d.data().monto} ✅</span></div>`;});document.getElementById('total').innerText='$'+total;document.getElementById('tuyo').innerText='$'+Math.round(total*0.85);document.getElementById('comision').innerText='$'+Math.round(total*0.15);document.getElementById('lista').innerHTML=html||'Aún sin propinas';});
}
async function entrarComoEspectador(id){
 document.getElementById('setup').style.display='none';document.getElementById('viewerUI').style.display='block';const roomRef=db.collection('fugaz_vivo').doc(id);const snap=await roomRef.get();if(!snap.exists){document.getElementById('viewerStatus').innerText='Vivo terminado';return;}currentAlias=snap.data().alias;document.getElementById('aliasShow').innerText=currentAlias;
 const pc=new RTCPeerConnection(ice);pc.addTransceiver('video',{direction:'recvonly'});pc.addTransceiver('audio',{direction:'recvonly'});const rs=new MediaStream();const v=document.getElementById('remoteVideo');v.srcObject=rs;pc.ontrack=e=>{e.streams[0].getTracks().forEach(t=>rs.addTrack(t));document.getElementById('viewerStatus').innerText='EN VIVO';document.getElementById('playOverlay').style.display='block';v.play().catch(()=>{});};const viewerDoc=roomRef.collection('viewers').doc();pc.onicecandidate=e=>{if(e.candidate) viewerDoc.collection('calleeCandidates').add(e.candidate.toJSON())};const offer=await pc.createOffer();await pc.setLocalDescription(offer);await viewerDoc.set({offer:{type:offer.type,sdp:offer.sdp}});viewerDoc.onSnapshot(async s=>{const d=s.data();if(d&&d.answer&&!pc.currentRemoteDescription){await pc.setRemoteDescription(new RTCSessionDescription(d.answer));}});viewerDoc.collection('callerCandidates').onSnapshot(s=>{s.docChanges().forEach(async c=>{if(c.type==='added')try{await pc.addIceCandidate(new RTCIceCandidate(c.doc.data()))}catch{}})});}
function desbloquear(){const v=document.getElementById('remoteVideo');v.muted=false;v.play().then(()=>document.getElementById('playOverlay').style.display='none');}
async function yaTransferi(){const monto=document.getElementById('monto').value;const id=currentRoomId||new URLSearchParams(location.search).get('id');try{await db.collection('fugaz_vivo').doc(id).collection('propinas').add({monto:Number(monto),ts:Date.now()});alert('¡Gracias! Le avisaste al artista $'+monto);}catch(e){alert('Error: '+e.message);}}
</script>
</body>
</html>
